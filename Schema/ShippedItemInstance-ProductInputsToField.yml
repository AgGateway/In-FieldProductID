---
openapi: "3.0.3"
info:
  title: AgGateway Shipped Item Instance
  description: "Allows the Farmer (via a mobile application or FMIS), or the Farmer's equipment manufacturer application (e.g., Deere Ops Center, AGCO Fuse, CNH AFS, etc.) to retrieve the Product shipped by a Retailer using the GET verb.  Allows the Retailer to send information about the actual product shipped to the Grower, including shipment identifer, product identifiers, seed lot id, and seed treatment.  Other products such as Crop Nutrition and Crop Protection, especially batch identifier and production composition, and carrier identification will be provide in a later release."
  version: '1.0'
servers:
  - url: https://shipped-item-instance.azure-api.net/wg01
paths:
  /setupfiles:
    get:
      summary: "GET a zipped file of setup files to load into the tractor display"
      description: "Using the shipment identifier and retailer's GLN, the API will return the original JSON that an array of items shipped from a retailer to the farmer."
      operationId: get-setupfiles
      tags:
      -  "Tractor display setup files"
      parameters:
        - name: shipment.identifier
          in: query
          description: shipment identifier generated by the retailer's system of the product shipped to the farmer.
          required: true
          schema:
            type: string
        - name: retailer.identifier
          in: query
          description: the GLN identifier of the retailer that shipped the product to the farmer.
          required: true
          schema:
            type: string
        - name: content-type
          in: header
          description: the content type that should be returned in the response.
          required: true
          schema:
            enum:
              - application/vnd.aggateway.adapt.adm+zip
              - application/vnd.aggateway.adapt.iso+zip
            type: string
            default: application/vnd.aggateway.adapt.adm+zip
      responses:
        "200":
          description: "OAGIS JSON as profiled in Score by AgGateway"
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
                example: binaryCharacters
  /shippedItemInstance:
    get:
      summary: GET JSON from NoSQL Database
      description: "Using the shipment identifier and retailer's GLN, the API will return the original JSON that an array of items shipped from a retailer to the farmer."
      operationId: get-shippediteminstance
      tags:
      - "Shipped Item Instance"
      parameters:
        - name: shipment.identifier
          in: query
          description: "shipment identifier generated by the retailer's system of the product shipped to the farmer."
          required: true
          schema:
            type: string
        - name: retailer.identifier
          in: query
          description: the GLN identifier of the retailer that shipped the product to the farmer.
          required: true
          schema:
            type: string
        - name: content-type
          in: header
          description: the content type that should be returned in the response.
          required: true
          schema:
            enum:
              - application/json
            type: string
            default: application/json
      responses:
        "200":
          description: "OAGIS JSON as profiled in Score by AgGateway"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/shippedItemInstance"
    post:
      summary: "POST JSON to NoSQL Database"
      description: ""
      operationId: post-shippediteminstance
      tags:
      - "Shipped Item Instance"
      requestBody:
        description: "OAGIS JSON as profiled in Score by AgGateway"
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/shippedItemInstance"
      responses:
        "200":
          description: ""
          content:
            application/json: 
              schema:
                type: string
                example: 9e944f86-1038-4ffa-b1ec-aefb6bb0c8b0
    put:
      summary: "PUT an updated JSON to NoSQL Database"
      description: ""
      operationId: put-shippediteminstance
      tags:
      - "Shipped Item Instance"
      parameters:
        - name: id
          in: query
          description: This is the id that was returned by the post-shippediteminstance operation.
          required: true
          schema:
            type: string
            example: 9e944f86-1038-4ffa-b1ec-aefb6bb0c8b0
      requestBody:
        description: "OAGIS JSON as profiled in Score by AgGateway"
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/shippedItemInstance"
      responses:
        "200":
          description: ""
          content:
            application/json: 
              schema:
                type: string
                example: 9e944f86-1038-4ffa-b1ec-aefb6bb0c8b0
    delete:
      summary: "DELETE JSON from NoSQL Database"
      description: ""
      operationId: delete-shippediteminstance
      tags:
      - "Shipped Item Instance"
      parameters:
        - name: id
          in: query
          description: This is the id that was returned by the post-shippediteminstance operation.
          required: true
          schema:
            type: string
            example: 9e944f86-1038-4ffa-b1ec-aefb6bb0c8b0
      responses:
        "200":
          description: "Returns the id deleted"
          content:
            application/json: 
              schema:
                type: string
                example: 9e944f86-1038-4ffa-b1ec-aefb6bb0c8b0
components:
  schemas:
    shippedItemInstance:
      required:
      - "shippedItemInstance"
      additionalProperties: false
      properties:
        shippedItemInstance:
          type: "array"
          items:
            additionalProperties: false
            properties:
              typeCode:
                description: "type of product shipped"
                example: "seed"
                type: "string"
                format: "token"
              identifier:
                description: "Shipment Line Identifier"
                type: "object"
                required:
                - "content"
                additionalProperties: false
                properties:
                  content:
                    type: "string"
                    format: "normalizedString"
                    example: "34343535-1"
                  typeCode:
                    description: "shipment line identifier"
                    example: "shipment_line_identifier"
                    type: "string"
                    format: "token"
              itemIdentifierSet:
                description: "List of product mixture identifiers that were blended\
                  \ together to create the seed treatment, and when lot[typeCode='batch'].identifier\
                  \ is present\nThis should be Item Composition component"
                type: "array"
                items:
                  type: "object"
                  required:
                  - "identifier"
                  additionalProperties: false
                  properties:
                    schemeIdentifier:
                      description: "Retailer's Seed Treatment identifier"
                      example: "1001339"
                      type: "string"
                      format: "normalizedString"
                    schemeVersionIdentifier:
                      description: "Description of the Seed Treatment"
                      example: "Basic + Saltro"
                      type: "string"
                      format: "normalizedString"
                    schemeAgencyIdentifier:
                      description: "retailer's seed treatment identifier"
                      example: "retailer_seed_treatment_identifier"
                      type: "string"
                      format: "normalizedString"
                    typeCode:
                      description: "seed treatment blended products with specific\
                        \ active ingredients"
                      example: "seed_treatment"
                      type: "string"
                      format: "token"
                    identifier:
                      description: "product or active_ingredient value"
                      type: "array"
                      minItems: 1
                      items:
                        type: "object"
                        required:
                        - "content"
                        additionalProperties: false
                        properties:
                          content:
                            type: "string"
                            format: "normalizedString"
                            example: "Acceleron Basic 15G"
                          schemeIdentifier:
                            description: "EPA Registration Identifier value"
                            example: "264-935-524"
                            type: "string"
                            format: "token"
                          schemeAgencyIdentifier:
                            description: "EPA Registration; \nQuestion came up why\
                              \ there can be multiple EPA registrations for the same\
                              \ product \npotential reasons: 1) expired and renewed\
                              \ with new identifier 2) identifier per active ingredient\
                              \ 3) different manufacturers under the same generic,\
                              \ and 4) label update"
                            example: "EPA"
                            type: "string"
                            format: "token"
                          typeCode:
                            description: "if 'active_ingredient', set to active_ingredient;\
                              \ should use the same controlled vocabulary as active\
                              \ ingredient in Product Catalog\nelse 'product'"
                            example: "product"
                            type: "string"
                            format: "token"
              uid:
                description: "DataMatrix or barcode encoding string"
                type: "object"
                required:
                - "content"
                additionalProperties: false
                properties:
                  content:
                    type: "string"
                    format: "normalizedString"
                    example: "0-539f82b1-df6e-11e9-b486-5ce0c51e62ce"
                  schemeIdentifier:
                    description: "encoding scheme"
                    example: "DataMatrix"
                    type: "string"
                    format: "token"
                  schemeAgencyIdentifier:
                    description: "Agency defining bar coding scheme"
                    example: "GS1"
                    type: "string"
                    format: "token"
                  typeCode:
                    description: "Implementation Guideline for encoding scheme"
                    example: "AgGateway"
                    type: "string"
                    format: "token"
              lot:
                description: "the various lot and / or batch identifiers associated\
                  \ to the shipped item\nLot identifier is related to homogeneous\
                  \ items, such as seed, grains.\nBatch identifiers are related to\
                  \ the mixture of homogeneous items, based on a formula/ recipe."
                type: "object"
                additionalProperties: false
                properties:
                  identifier:
                    description: "lot or batch identifier value"
                    type: "object"
                    required:
                    - "content"
                    additionalProperties: false
                    properties:
                      content:
                        type: "string"
                        format: "normalizedString"
                        example: "769MXJ4JX"
                      typeCode:
                        description: "seed use 'lot', seed treatment use 'batch',\
                          \ crop protection use 'batch', crop nutrition use 'batch'"
                        example: "Lot"
                        type: "string"
                        format: "token"
                  serialNumberIdentifier:
                    type: "array"
                    items:
                      oneOf:
                      - nullable: true
                      - description: "Array of serial numbers associated to a specific\
                          \ lot or batch, used for serialized packages.  Useful for\
                          \ blockchain applications such as Crop Protection."
                        example: "c93b67b1-b62e-45b4-96fe-1277a341dc0d"
                        type: "string"
                        format: "normalizedString"
              item:
                type: "object"
                additionalProperties: false
                properties:
                  manufacturerItemIdentification:
                    description: "Manufacturer's Item identifier"
                    type: "object"
                    additionalProperties: false
                    properties:
                      typeCode:
                        description: "type of manufacturer's item identifier"
                        example: "SKU"
                        type: "string"
                        format: "token"
                      identifier:
                        description: "if no GTIN, then this is required, likely the\
                          \ manufacturer's SKU"
                        example: "34323656565"
                        type: "string"
                        format: "normalizedString"
                  upcid:
                    description: "Uniform Product Code"
                    example: "888346580291"
                    type: "string"
                    format: "normalizedString"
                  gtinid:
                    description: "GTIN for the packaged product instance, as maintained\
                      \ by GS1"
                    example: "00888346580291"
                    type: "string"
                    format: "normalizedString"
                  description:
                    description: "Full AGIIS description"
                    example: "DKC62-53RIB AF2 VR2P SP50 BAS250 B"
                    type: "string"
                  productName:
                    description: "product name"
                    example: "DEKALB"
                    type: "string"
                  brandName:
                    description: "brand name"
                    example: "DEKALB"
                    type: "string"
                  varietyName:
                    description: "Variety of a product or brand, perhaps a minor genetic\
                      \ trait or grading typically based on quality measures (sorting)"
                    example: "DEKALB"
                    type: "string"
              quantity:
                type: "object"
                required:
                - "content"
                additionalProperties: false
                properties:
                  content:
                    type: "number"
                    example: "100"
                  unitCode:
                    example: "BG"
                    type: "string"
                    format: "token"
              description:
                description: "This is the 'mics_display' description which is a concatenation\
                  \ seed lot identifier, prefixed by the product description"
                type: "object"
                required:
                - "content"
                additionalProperties: false
                properties:
                  content:
                    type: "string"
                    example: "DKC6253RIB-769MXJ4JX"
                  typeCode:
                    description: "\"mics_display\" first ten characters of long description\
                      \ and ten characters of lot identifier; .e.g, DKC6253RIB-769MXJ4JX\n\
                      \"long\" description  DKC62-53RIB AF2 VR2P SP50 BAS250 B"
                    example: "mics_display"
                    type: "string"
                    format: "token"
              classification:
                type: "object"
                additionalProperties: false
                properties:
                  typeCode:
                    description: "Type of classification"
                    example: "Crop"
                    type: "string"
                    format: "token"
                  codes:
                    type: "object"
                    required:
                    - "code"
                    additionalProperties: false
                    properties:
                      code:
                        type: "array"
                        minItems: 1
                        items:
                          type: "object"
                          required:
                          - "content"
                          additionalProperties: false
                          properties:
                            content:
                              type: "string"
                              format: "normalizedString"
                              example: "11199199"
                            listAgencyIdentifier:
                              example: "USDA"
                              type: "string"
                              format: "token"
                            typeCode:
                              description: "Use as the description / definition."
                              example: "Corn For Grain"
                              type: "string"
                              format: "token"
              packaging:
                type: "object"
                additionalProperties: false
                properties:
                  typeCode:
                    description: "type of packaging; BulkBox, Pallet; the tags will\
                      \ continue to be sent with the bulk box"
                    example: "BulkBox"
                    type: "string"
                    format: "token"
                  identifier:
                    description: "Identifier of the container, often a serial number\
                      \ of a reusable containers such as a seed tender, bulk box,\
                      \ pallet, etc."
                    example: "844f95ac-422a-406a-91c5-65d017de2f09"
                    type: "string"
                    format: "normalizedString"
              documentReference:
                type: "object"
                additionalProperties: false
                properties:
                  identifier:
                    description: "NotifyShipment shipment identifier"
                    type: "object"
                    required:
                    - "content"
                    additionalProperties: false
                    properties:
                      content:
                        type: "string"
                        format: "normalizedString"
                        example: "34343535"
                      typeCode:
                        description: "shipment_identifier"
                        example: "shipment_identifier"
                        type: "string"
                        format: "token"
                  typeCode:
                    description: "This is the reference to the NotifyShipment document\
                      \ from which this is a subset of."
                    example: "NotifyShipment"
                    type: "string"
                    format: "token"
                  documentDateTime:
                    description: "Date timestamp of the NotifyShipment; date the truck\
                      \ left the retailer"
                    example: "2020-08-07T15:15:01.123-05:00"
                    type: "string"
                    format: "token"
              attachment:
                type: "object"
                additionalProperties: false
                properties:
                  typeCode:
                    description: "Reference Data API"
                    example: "AGIIS"
                    type: "string"
                    format: "token"
                  uri:
                    description: "link to agiis or product"
                    example: "https://api.agiis.org/"
                    type: "string"
                    format: "normalizedString"
              manufacturingParty:
                description: "Manufacturer of the product going into the field"
                type: "object"
                additionalProperties: false
                properties:
                  identifier:
                    description: "GLN for the manufacturer"
                    type: "object"
                    required:
                    - "content"
                    additionalProperties: false
                    properties:
                      content:
                        type: "string"
                        format: "normalizedString"
                        example: "343434"
                      typeCode:
                        description: "type of identifier for the manufacturer"
                        example: "GLN"
                        type: "string"
                        format: "token"
                  name:
                    description: "product manufacturer's name"
                    example: "Bayer"
                    type: "string"
              party:
                description: "parties involved with the shipment transaction, usually\
                  \ distributor, retailer and grower"
                type: "array"
                items:
                  type: "object"
                  additionalProperties: false
                  properties:
                    typeCode:
                      description: "retailer | farmer | distributor | agronomist |\
                        \ grower | nutritionist"
                      example: "retailer"
                      type: "string"
                      format: "token"
                    identifier:
                      description: "if typeCode='retailer', identifier of shipper/\
                        \ retailer\nif typeCode='farmer', identifier of the farmer, "
                      type: "array"
                      items:
                        type: "object"
                        required:
                        - "content"
                        additionalProperties: false
                        properties:
                          content:
                            type: "string"
                            format: "normalizedString"
                            example: "1100028417954"
                          typeCode:
                            description: "Global Local Number for Retailer's location"
                            example: "GLN"
                            type: "string"
                            format: "token"
                    name:
                      description: "Name  of shipper/ retailer / farmer"
                      example: "Ceres Solutions"
                      type: "string"
                    location:
                      type: "object"
                      additionalProperties: false
                      properties:
                        name:
                          description: "location name, if multiple locations for a\
                            \ party"
                          example: "New Lebanon Seed Hub"
                          type: "string"
                        glnid:
                          example: "1100028417954"
                          type: "string"
                          format: "normalizedString"
              results:
                type: "object"
                additionalProperties: false
                properties:
                  quantitative:
                    type: "array"
                    items:
                      type: "object"
                      additionalProperties: false
                      properties:
                        typeCode:
                          example: "SeedCountPerPound"
                          type: "string"
                          format: "token"
                        name:
                          description: "Name of the measurement"
                          example: "Seed Count Per Pound"
                          type: "string"
                        uomCode:
                          description: "Unit of the measure"
                          type: "object"
                          required:
                          - "content"
                          additionalProperties: false
                          properties:
                            content:
                              type: "string"
                              format: "token"
                              example: "Seeds/LB"
                            listIdentifier:
                              description: "List "
                              example: "https://www.idseed.org/pages/seed_size_measurement_protocol_new.html"
                              type: "string"
                              format: "normalizedString"
                            listAgencyIdentifier:
                              description: "agency managing the list"
                              example: "IPSA"
                              type: "string"
                              format: "token"
                        significantDigitsNumber:
                          example: "0"
                          type: "number"
                        measurement:
                          type: "array"
                          items:
                            type: "object"
                            required:
                            - "measure"
                            additionalProperties: false
                            properties:
                              dateTime:
                                description: "Timestamp of the measurement"
                                example: "2021-02-08T13:17:45.034-05:00"
                                type: "string"
                                format: "date-time"
                              measure:
                                example: "892"
                                type: "number"
