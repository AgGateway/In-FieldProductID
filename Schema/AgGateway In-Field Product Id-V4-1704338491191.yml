openapi: "3.0.3"
info:
  title: "AgGateway In-Field Product Id"
  description: "Allows the Retailer to send information about the actual product shipped\
    \ to the Farmer, including shipment identifer, product identifiers, seed lot id,\
    \ mixture batch id, seed treatment and product composition.  Allows the Farmer\
    \ (via a mobile application or FMIS), or the Farmer's equipment manufacturer application\
    \ (aka OEM Platform, e.g., Deere Operations Center, AGCO Fuse, CNH AFS, etc.)\
    \ to retrieve the Product shipped by a Retailer using GET /setupfiles.   "
  contact:
    name: "WG01"
    url: "https://wg01.aggateway.org/info"
    email: "wg01@aggateway.org"
  version: "V4"
  x-oagis-license: ""
