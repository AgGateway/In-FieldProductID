                  properties:
                    typeCode:
                      allOf:
                        - $ref: '#/components/schemas/token'
                        - description: seed treatment blended products with specific active ingredients
                          example: seed_treatment
                    schemeVersionIdentifier:
                      allOf:
                        - $ref: '#/components/schemas/normalizedString'
                        - description: Description of the Seed Treatment
                          example: Basic + Saltro
                    schemeIdentifier:
                      allOf:
                        - $ref: '#/components/schemas/normalizedString'
                        - description: Retailer's Seed Treatment identifier
                          example: '1001339'
                    schemeAgencyIdentifier:
                      allOf:
                        - $ref: '#/components/schemas/normalizedString'
                        - description: retailer_seed_treament_identifier
                          example: retailer_seed_treament_identifier
                    identifier:
                      minItems: 1
                      type: array
                      items:
                        required:
                          - content
                        type: object
                        properties:
                          content:
                            allOf:
                              - $ref: '#/components/schemas/normalizedString'
                              - example: Acceleron Basic 15G
                          typeCode:
                            allOf:
                              - $ref: '#/components/schemas/token'
                              - description: "if 'active_ingredient', set to active_ingredient; should use the same controlled vocabulary as active ingredient in Product Catalog\nelse 'product'"
                                example: product
                          schemeIdentifier:
                            allOf:
                              - $ref: '#/components/schemas/token'
                              - description: EPA Registration Identifier value
                                example: 264-935-524
                          schemeAgencyIdentifier:
                            allOf:
                              - $ref: '#/components/schemas/token'
                              - description: "EPA Registration; \nQuestion came up why there can be multiple EPA registrations for the same product \npotential reasons: 1) expired and renewed with new identifier 2) identifier per active ingredient 3) different manufacturers under the same generic, and 4) label update"
                                example: EPA
                        additionalProperties: false
                      description: product or active_ingredient value
                  additionalProperties: false
