              manufacturerItemIdentification:
                type: object
                properties:
                  identifier:
                    required:
                      - content
                    type: object
                    properties:
                      content:
                        allOf:
                          - $ref: '#/components/schemas/normalizedString'
                          - example: '34323656565'
                      typeCode:
                        allOf:
                          - $ref: '#/components/schemas/token'
                          - description: SKU or otherwise specified
                            example: SKU
                    additionalProperties: false
                    description: 'if no GTIN, then this is required, likely the manufacturer''s SKU'
