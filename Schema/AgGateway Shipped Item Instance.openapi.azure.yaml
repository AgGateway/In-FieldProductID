                allOf:
                  - $ref: '#/components/schemas/normalizedString'
                  - description: 'GTIN for the packaged product instance, as maintained by GS1'
                    example: '00888346580291'
              uid:
                required:
                  - content
                type: object
                properties:
                  content:
                    allOf:
                      - $ref: '#/components/schemas/normalizedString'
                      - example: 0-539f82b1-df6e-11e9-b486-5ce0c51e62ce
                  typeCode:
                    allOf:
                      - $ref: '#/components/schemas/token'
                      - description: Implementation Guideline for encoding scheme
                        example: AgGateway
                  schemeIdentifier:
                    allOf:
                      - $ref: '#/components/schemas/token'
                      - description: encoding scheme
                        example: DataMatrix
                  schemeAgencyIdentifier:
                    allOf:
                      - $ref: '#/components/schemas/token'
                      - description: Agency defining bar coding scheme
                        example: GS1
                additionalProperties: false
                description: DataMatrix or barcode encoding string
              lot:
                type: object
                properties:
                  identifier:
                    required:
                      - content
                    type: object
                    properties:
                      content:
                        allOf:
                          - $ref: '#/components/schemas/normalizedString'
                          - example: 769MXJ4JX
                      typeCode:
                        allOf:
                          - $ref: '#/components/schemas/token'
                          - description: 'seed use ''lot'', seed treatment use ''batch'', crop protection use ''batch'', crop nutrition use ''batch'''
                            example: Lot
                    additionalProperties: false
                    description: lot or batch identifier value
                  serialNumberIdentifier:
                    type: array
                    items:
                      allOf:
                        - $ref: '#/components/schemas/normalizedString'
                        - description: 'Array of serial numbers associated to a specific lot or batch, used for serialized packages.  Useful for blockchain applications such as Crop Protection.'
                          example: c93b67b1-b62e-45b4-96fe-1277a341dc0d
                additionalProperties: false
                description: "the various lot and / or batch identifiers associated to the shipped item\nLot identifier is related to homogeneous items, such as seed, grains.\nBatch identifiers are related to the mixture of homogeneous items, based on a formula/ recipe."
              quantity:
                required:
                  - content
                type: object
                properties:
                  content:
                    allOf:
                      - $ref: '#/components/schemas/decimal'
                      - example: '100'
                  unitCode:
                    allOf:
                      - $ref: '#/components/schemas/token'
                      - example: BG
                additionalProperties: false
              description:
                type: array
                items:
                  required:
                    - content
                  type: object
                  properties:
                    content:
                      allOf:
                        - $ref: '#/components/schemas/string'
                        - example: DKC6253RIB-769MXJ4JX
                    typeCode:
                      allOf:
                        - $ref: '#/components/schemas/string'
                        - description: "\"mics_display\" first ten characters of long description and ten characters of lot identifier; .e.g, DKC6253RIB-769MXJ4JX\n\"long\" description  DKC62-53RIB AF2 VR2P SP50 BAS250 B"
                          example: mics_display
                  additionalProperties: false
                description: can be either 'mics_display' description or ''detailed' long description. therefore this is an array
              classification:
                type: object
                properties:
                  typeCode:
                    allOf:
                      - $ref: '#/components/schemas/token'
                      - description: Type of classification
                        example: Crop
                  codes:
                    required:
                      - code
                    type: object
                    properties:
                      code:
                        minItems: 1
                        type: array
                        items:
                          required:
                            - content
                          type: object
                          properties:
                            content:
                              allOf:
                                - $ref: '#/components/schemas/normalizedString'
                                - example: '11199199'
                            typeCode:
                              allOf:
                                - $ref: '#/components/schemas/token'
                                - description: Use as the description / definition.
                                  example: Corn For Grain
                            listAgencyIdentifier:
                              allOf:
                                - $ref: '#/components/schemas/token'
                                - example: USDA
                          additionalProperties: false
                    additionalProperties: false
                additionalProperties: false
              documentReference:
                type: object
                properties:
                  typeCode:
                    allOf:
                      - $ref: '#/components/schemas/token'
                      - description: This is the reference to the NotifyShipment document from which this is a subset of.
                        example: NotifyShipment
                  identifier:
                    required:
                      - content
                    type: object
                    properties:
                      content:
                        allOf:
                          - $ref: '#/components/schemas/normalizedString'
                          - example: '34343535'
                      typeCode:
                        allOf:
                          - $ref: '#/components/schemas/token'
                          - description: shipment_identifier
                            example: shipment_identifier
                    additionalProperties: false
                    description: NotifyShipment shipment identifier
                  documentDateTime:
                    allOf:
                      - $ref: '#/components/schemas/dateTime'
                      - description: Date timestamp of the NotifyShipment; date the truck left the retailer
                        example: '2020-08-07T20:15:01.123+00:00'
                additionalProperties: false
              attachment:
                type: object
                properties:
                  typeCode:
                    allOf:
                      - $ref: '#/components/schemas/token'
                      - description: Reference Data API
                        example: ReferenceDataAPI
                  uri:
                    allOf:
                      - $ref: '#/components/schemas/normalizedString'
                      - description: link to agiis or product
                        example: https://agiis.aggateway.org/
                additionalProperties: false
              manufacturingParty:
                type: object
                properties:
                  identifier:
                    required:
                      - content
                    type: object
                    properties:
                      content:
                        allOf:
                          - $ref: '#/components/schemas/normalizedString'
                          - example: '343434'
                      typeCode:
                        allOf:
                          - $ref: '#/components/schemas/token'
                          - description: type of identifier for the manufacturer
                            example: GLN
                    additionalProperties: false
                    description: GLN for the manufacturer
                  name:
                    allOf:
                      - $ref: '#/components/schemas/string'
                      - description: product manufacturer's name
                        example: Bayer
                additionalProperties: false
                description: Manufacturer of the product going into the field
              party:
                type: array
                items:
                  type: object
                  properties:
                    typeCode:
                      allOf:
                        - $ref: '#/components/schemas/token'
                        - description: retailer | farmer | distributor | agronomist | grower | nutritionist
                          example: retailer
                    identifier:
                      type: array
                      items:
                        required:
                          - content
                        type: object
                        properties:
                          content:
                            allOf:
                              - $ref: '#/components/schemas/normalizedString'
                              - example: '1100028417954'
                          typeCode:
                            allOf:
                              - $ref: '#/components/schemas/token'
                              - description: Global Local Number for Retailer's location
                                example: GLN
                        additionalProperties: false
                      description: "if typeCode='retailer', identifier of shipper/ retailer\nif typeCode='farmer', identifier of the farmer"
                    name:
                      allOf:
                        - $ref: '#/components/schemas/string'
                        - description: Name  of shipper/ retailer / farmer
                          example: 'Ceres Solutions, New Lebanon Seed Hub'
                    location:
                      type: object
                      properties:
                        glnid:
                          allOf:
                            - $ref: '#/components/schemas/normalizedString'
                            - example: '1100028417954'
                      additionalProperties: false
                  additionalProperties: false
                description: 'parties involved with the shipment transaction, usually distributor, retailer and grower'
              extension:
                type: object
                properties:
                  results:
                    type: object
                    properties:
                      quantitative:
                        type: object
                        properties:
                          resultValue:
                            type: array
                            items:
                              required:
                                - content
                                - name
                              type: object
                              properties:
                                content:
                                  allOf:
                                    - $ref: '#/components/schemas/string'
                                    - example: '23230'
                                name:
                                  allOf:
                                    - $ref: '#/components/schemas/string'
                                    - description: 'lot-weight, seed-count, seed-size are options'
                                      example: lot-weight
                                unitCode:
                                  allOf:
                                    - $ref: '#/components/schemas/token'
                                    - description: "if lot-weight, then 'LB' \nif seed-count, then 'EA'\nif seed-size, then 'IN'\nelse suppress results."
                                      example: LB
                              additionalProperties: false
                        additionalProperties: false
                    additionalProperties: false
                additionalProperties: false
            additionalProperties: false
      additionalProperties: false
  securitySchemes:
    apiKeyHeader:
      type: apiKey
      name: Ocp-Apim-Subscription-Key
      in: header
    apiKeyQuery:
      type: apiKey
      name: subscription-key
      in: query
security:
  - apiKeyHeader: [ ]
  - apiKeyQuery: [ ]