openapi: 3.0.1
info:
  title: AgGateway Shipped Item Instance
  description: 'Allows the Farmer or the Farmer''s equipment manufacturer application (e.g., Deere Ops Center) to retrieve the Product shipped by a Retailer using the GET verb.  Allows the Retailer to POST the identifiers of the product shipped to the Grower, which will be retrieved by the Grower''s system.'
  version: '1.0'
servers:
  - url: https://shipped-item-instance.azure-api.net/wg01
paths:
  /shippedItemInstance:
    get:
      summary: GET from Cosmos
      description: 'Using the shipment identifier, one can retrieve an array of items shipped from a retailer.'
      operationId: get-shippediteminstance
      parameters:
        - name: shipment.identifier
          in: query
          description: shipment identifier generated by the retailer's system of the product shipped to the farmer.
          required: true
          schema:
            type: string
        - name: retailer.identifier
          in: query
          description: the GLN identifier of the retailer that shipped the product to the farmer.
          required: true
          schema:
            type: string
        - name: content-type
          in: header
          description: the content type that should be returned in the response.
          required: true
          schema:
            enum:
              - application/json
              - application/vnd.aggateway.adapt.adm+zip
              - application/vnd.iso.11783+zip
            type: string
            default: application/json
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/get-shippedItemInstance-oagis-id-52966b796431464ebf1b132142fad43a'
              example:
                metaHeader:
                  senderIdentifier: { }
                  intermediaryIdentifier: { }
                  receiverIdentifier:
                    - { }
                  creationDateTime: { }
                  scenarioIdentifier: { }
                  correlationIdentifier: { }
                  messageIdentifier: { }
                shippedItemInstance:
                  - typeCode: { }
                    identifier:
                      content: { }
                      typeCode: { }
                    variationIdentifier:
                      content: { }
                      typeCode: { }
                    itemIdentifierSet:
                      - typeCode: { }
                        schemeVersionIdentifier: { }
                        schemeIdentifier: { }
                        schemeAgencyIdentifier: { }
                        identifier:
                          - content: { }
                            typeCode: { }
                            schemeIdentifier: { }
                            schemeAgencyIdentifier: { }
                    manufacturerItemIdentification:
                      identifier:
                        content: { }
                        typeCode: { }
                    upcid: { }
                    gtinid: { }
                    uid:
                      content: { }
                      typeCode: { }
                      schemeIdentifier: { }
                      schemeAgencyIdentifier: { }
                    lot:
                      identifier:
                        content: { }
                        typeCode: { }
                      serialNumberIdentifier:
                        - { }
                    quantity:
                      content: { }
                      unitCode: { }
                    description:
                      - content: { }
                        typeCode: { }
                    classification:
                      typeCode: { }
                      codes:
                        code:
                          - content: { }
                            typeCode: { }
                            listAgencyIdentifier: { }
                    documentReference:
                      typeCode: { }
                      identifier:
                        content: { }
                        typeCode: { }
                      documentDateTime: { }
                    attachment:
                      typeCode: { }
                      uri: { }
                    manufacturingParty:
                      identifier:
                        content: { }
                        typeCode: { }
                      name: { }
                    party:
                      - typeCode: { }
                        identifier:
                          - content: { }
                            typeCode: { }
                        name: { }
                        location:
                          glnid: { }
                    extension:
                      results:
                        quantitative:
                          resultValue:
                            - content: { }
                              name: { }
                              unitCode: { }
  /shippediteminstance:
    post:
      summary: POST to Cosmos
      description: Provides the ability to send shipped item instance JSON to Cosmos
      operationId: post-shippediteminstance
      requestBody:
        description: OAGIS JSON
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/post-shippedItemInstance-oagis-id-52966b796431464ebf1b132142fad43a'
            example:
              metaHeader:
                senderIdentifier: { }
                intermediaryIdentifier: { }
                receiverIdentifier:
                  - { }
                creationDateTime: { }
                scenarioIdentifier: { }
                correlationIdentifier: { }
                messageIdentifier: { }
                eventIdentifier:
                  - { }
              shippedItemInstance:
                - typeCode: { }
                  identifier:
                    content: { }
                    typeCode: { }
                  variationIdentifier:
                    content: { }
                    typeCode: { }
                  itemIdentifierSet:
                    - typeCode: { }
                      schemeVersionIdentifier: { }
                      schemeIdentifier: { }
                      schemeAgencyIdentifier: { }
                      identifier:
                        - content: { }
                          typeCode: { }
                          schemeIdentifier: { }
                          schemeAgencyIdentifier: { }
                  manufacturerItemIdentification:
                    identifier:
                      content: { }
                      typeCode: { }
                  upcid: { }
                  gtinid: { }
                  uid:
                    content: { }
                    typeCode: { }
                    schemeIdentifier: { }
                    schemeAgencyIdentifier: { }
                  lot:
                    identifier:
                      content: { }
                      typeCode: { }
                    serialNumberIdentifier:
                      - { }
                  quantity:
                    content: { }
                    unitCode: { }
                  description:
                    - content: { }
                      typeCode: { }
                  classification:
                    typeCode: { }
                    codes:
                      code:
                        - content: { }
                          typeCode: { }
                          listAgencyIdentifier: { }
                  documentReference:
                    typeCode: { }
