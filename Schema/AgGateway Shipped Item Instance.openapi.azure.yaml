                properties:
                  content:
                    allOf:
                      - $ref: '#/components/schemas/normalizedString'
                      - example: DEKALB
                  typeCode:
                    allOf:
                      - $ref: '#/components/schemas/token'
                      - description: Seed Variety
                        example: seed_variety
                additionalProperties: false
                description: Seed Variety identifier
              itemIdentifierSet:
                type: array
                items:
                  required:
                    - identifier
