          application/json:
            schema:
              $ref: "#/components/schemas/shippedItemInstanceList"
      responses:
        "200":
          description: ""
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/shippedItemInstanceList"
    put:
      summary: ""
      description: ""
      security:
      - OAuth2:
        - "shippedItemInstanceWrite"
      tags:
      - "Retailer Shipment"
      operationId: "replaceShippedItemInstanceList"
      requestBody:
        description: ""
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/shippedItemInstanceList"
      responses:
        "200":
          description: ""
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/shippedItemInstanceList"
    delete:
      summary: ""
      description: ""
      security:
      - OAuth2:
        - "shipmentReferenceWrite"
      tags:
      - "Retailer Shipment"
      operationId: "deleteShipmentReferenceList"
      responses:
        "200":
          description: ""
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/shipmentReferenceListResponse"
  /in-field-product-id/v4/setup-files:
    get:
      summary: GET a zipped file of setup files to load into the tractor display
      description: Using the shipment identifier and retailer's GLN, the API will return an octet-stream of zip file containing either ISOBUS XML or the ADAPT ADM protobuf formatted files.
      operationId: get-setupfiles
      tags:
        - Tractor display setup files
      parameters:
        - name: shipmentId
          in: query
          description: shipment identifier generated by the retailer's system of the product shipped to the farmer.
          required: true
          schema:
            type: string
        - name: retailerId
          in: query
          description: the GLN identifier of the retailer that shipped the product to the farmer.
          required: true
          schema:
            type: string
        - name: content-type
          in: header
          description: the content type that should be returned in the response.
          required: true
          schema:
            enum:
              - application/vnd.aggateway.adapt.adm+zip
              - application/vnd.aggateway.adapt.iso+zip
            type: string
            default: application/vnd.aggateway.adapt.iso+zip
      responses:
        '200':
          description: OAGIS JSON as profiled in Score by AgGateway
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
                example: binaryCharacters
