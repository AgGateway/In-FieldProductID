        description: the GLN identifier of the retailer that shipped the product to the farmer.
        required: true
        schema:
          type: string
      - name: shipmentId
        in: query
        description: shipment identifier generated by the retailer's system of the product shipped to the farmer.
        required: false
        schema:
          type: string
      - name: "sinceLastDateTime"
        in: "query"
        description: "Returns resources that have been updated since the last time\
          \ the endpoint has been called"
        required: false
        schema:
          type: "string"
          format: "date-time"
      responses:
        "200":
          description: ""
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/shippedItemInstanceList"
    post:
