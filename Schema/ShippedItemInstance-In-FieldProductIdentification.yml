    shippedItemInstanceList:
      type: "array"
      items:
        $ref: "#/components/schemas/shippedItemInstance"
    shippedItemInstance:
      x-oagis-bie-guid: "51cadda6385548768ea5bed056342fa1"
      x-oagis-bie-date-time: "2024-04-09T02:24:23+0000"
      x-oagis-bie-version: "V4.1"
      x-oagis-bie-den: "Shipped Item Instance"
      x-oagis-bie-uri: "https://oagiscore.net/profile_bie/924"
      x-oagis-release: "10.10.4"
      x-oagis-release-date: "2024-04-03"
      type: "object"
      description: "V4.1 S&G approved 2025-04-17\nTo enable PackageQuantity, for the\
        \ number of bags that were placed in a seed tender box\n-enabled ShippedItemInstance.Quantity.TypeCode\n\
        To allow for rejected quantity  reasons\n-enable ShipmentReference.Note (0:1)\
        \ - \nAllow shipments from the farm to the retailer/ elevator / processor\n\
        -enabled ShipFromParty.AccountIdentifier (0:1)\n-enabled ShipToParty.Identifier\
        \ (0:1)\n\nChanges V3-V4:\n1) Party -> shipToParty (grower) and shipFromParty\
        \ (Retailer), etc.\n2) Attachment -> item.relatedIds -- URI reference to AGIIS\n\
        3) Quantity removed from Substance (Not realistic)\n4) Lot flattened\n5) Shipment\
        \ Reference now includes shipTo and shipFrom parties, receipt date at the\
        \ farm, or pickup date at the retailer, and received, accepted, rejected,\
        \ and return quantities and RMA identifier.\n6) Simplified the Results.Quantitative.Measurement[]\
        \ structure, flattening measurement\n\nShipped Item Instance is an implementation\
        \ guideline of a simplified Advance Ship Notice allow Retailers to send a\
        \ digital representation of their delivery document regarding products such\
        \ as seed, crop nutrition, and crop protection delivered to a farmer.  The\
        \ JSON representation can be processed by a FMIS, mobile application or OEM\
        \ platform to load product information directly into a tractor display to\
        \ help identify products during the actual field operations.  Other information\
        \ may be retained within the processing application for correlation after\
        \ the operation is completed for further record keeping based on key identifiers\
        \ pushed to the tractor display and returned back in the work records for\
        \ that operation.\n\nApproved in Standards and Guidelines 2022-08-18\n\n"
      additionalProperties: false
      properties:
        typeCode:
          description: "type of product shipped; Seed, CP = Crop protection, or CN\
            \ = Crop Nutrition"
          example: "seed"
          type: "string"
          format: "token"
        id:
          example: ""
          type: "string"
          format: "normalizedString"
        uid:
          description: "DataMatrix or barcode encoding string"
          type: "object"
          required:
          - "content"
          additionalProperties: false
          properties:
            content:
              type: "string"
              format: "normalizedString"
              example: "0-539f82b1-df6e-11e9-b486-5ce0c51e62ce"
            schemeId:
              description: "encoding scheme"
              example: "DataMatrix"
              type: "string"
              format: "token"
            schemeAgencyId:
              description: "Agency defining bar coding scheme"
              example: "GS1"
              type: "string"
              format: "token"
            typeCode:
              description: "Implementation Guideline for encoding scheme"
              example: "AgGateway"
              type: "string"
              format: "token"
        lot:
          description: "the various lot and / or batch identifiers associated to the\
            \ shipped item\nLot identifier is related to homogeneous items, such as\
            \ seed, grains.\nBatch identifiers are related to the mixture of homogeneous\
            \ items, based on a formulation of mixed active ingredient of crop nutrition\
            \ or crop protection."
          type: "object"
          additionalProperties: false
          properties:
            typeCode:
              description: "if typeCode=Seed, then Lot, else Batch for CN and CP"
              example: "Lot"
              type: "string"
              format: "token"
            id:
              description: "lot or batch identifier value"
              example: "769MXJ4JX"
              type: "string"
              format: "normalizedString"
            serialNumberId:
              description: "If typeCode = CP; array of serial numbers for serialized\
                \ jugs of crop protection products linked to a special batch.  Useful\
                \ for blockchain applications such as Crop Protection."
              type: "array"
              items:
                example: "c93b67b1-b62e-45b4-96fe-1277a341dc0d"
                type: "string"
                format: "normalizedString"
        item:
          $ref: "#/components/schemas/item"
        quantity:
          description: "Number of seed bags or quantity of other product if crop protection"
          type: "object"
          required:
          - "content"
          additionalProperties: false
          properties:
            content:
              type: "number"
              example: "45"
            unitCode:
              example: "BG"
              type: "string"
              format: "token"
            typeCode:
              description: "Type of quantity, as related to the packaging instance\
                \ (shippedItemInstance.Packaging).  For example, the number of bags\
                \ that were loaded into a seed tender box during seed treatment."
              example: "PackageCount"
              type: "string"
              format: "token"
        packaging:
          description: "Transport Package;\n- Shipping pallet of bags of seed or cartons\
            \ of crop protection.\n- Seed bulk box where multiple bags of seed are\
            \ treated at a retailer and conveyed into a tote or seed box (mini-bulk)\
            \ for use with a seed tender.  \n\nA printed manifest tag with barcode\
            \ detailed in packaging.identifier must be included with the seed box,\
            \ tote or pallet for ease of use.\nIt is NOT recommended to commingle\
            \ seed varieties and seed lots.   But if that does happen, multiple shipped\
            \ item instances array entries would have the same destination package,\
            \ denoting the which seed varieties and seed lot may have been mixed into\
            \ a single tote or seed box. \nThe dimensions of a seed box e.g. https://www.rppcontainers.com/Hopper-Bottom-Containers/hopper-bottom-57x45x65,\
            \ or pallet are not in scope."
          type: "object"
          additionalProperties: false
          properties:
            typeCode:
              description: "Type of packaging; SeedBox, Tote, Pallet; \n"
              example: "SeedBox"
              type: "string"
              format: "token"
            id:
              description: "Identifier of the container, often a serial number of\
                \ a reusable containers such as a seed tender, bulk box, pallet, etc.\n"
              example: "844f95ac-422a-406a-91c5-65d017de2f09"
              type: "string"
              format: "normalizedString"
            quantity:
              description: "Total gross weight of the seed box, or pallet.  \nThis\
                \ is defined as the tare weight (weight of the container, box or pallet)\
                \ plus the net weight, which is the number of bags x weight of each\
                \ bag, plus the weight of the treatment if seed treatment and loaded\
                \ into the seed box."
              type: "object"
              required:
              - "content"
              additionalProperties: false
              properties:
                content:
                  type: "number"
                  example: "2475"
                typeCode:
                  description: "Gross Weight of the shipping container"
                  example: "GrossWeight"
                  type: "string"
                  format: "token"
                unitCode:
                  description: "Unit of measure of the gross weight"
                  example: "LB"
                  type: "string"
                  format: "token"
        results:
          $ref: "#/components/schemas/results"
        displayName:
          description: "This is a concatenation seed lot identifier, prefixed by the\
            \ product description that will appear in the MICS display."
          example: "CP2585-769MXJ4JX"
          type: "string"
        shipmentReference:
          $ref: "#/components/schemas/shipmentReference"
