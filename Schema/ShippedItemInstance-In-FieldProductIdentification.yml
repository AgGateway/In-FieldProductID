openapi: 3.0.3
info:
  title: AgGateway Shipped Item Instance
  description: Allows the Retailer to send information about the actual product shipped to the Farmer, including shipment identifer, product identifiers, seed lot id, mixture batch id, seed treatment and product composition.  Allows the Farmer (via a mobile application or FMIS), or the Farmer's equipment manufacturer application (aka OEM Platform, e.g., Deere Operations Center, AGCO Fuse, CNH AFS, etc.) to retrieve the Product shipped by a Retailer using GET /setupfiles.   
  version: '2.0'
servers:
  - url: https://shipped-item-instance.azure-api.net/wg01
paths:
  /v2/setupfiles:
    get:
      summary: GET a zipped file of setup files to load into the tractor display
      description: Using the shipment identifier and retailer's GLN, the API will return an octet-stream of zip file containing either ISOBUS XML or the ADAPT ADM protobuf formatted files.
      operationId: get-setupfiles
      tags:
        - Tractor display setup files
      parameters:
        - name: shipment.identifier
          in: query
          description: shipment identifier generated by the retailer's system of the product shipped to the farmer.
          required: true
          schema:
            type: string
        - name: retailer.identifier
          in: query
          description: the GLN identifier of the retailer that shipped the product to the farmer.
          required: true
          schema:
            type: string
        - name: content-type
          in: header
          description: the content type that should be returned in the response.
          required: true
          schema:
            enum:
              - application/vnd.aggateway.adapt.adm+zip
              - application/vnd.aggateway.adapt.iso+zip
            type: string
            default: application/vnd.aggateway.adapt.iso+zip
      responses:
        '200':
          description: OAGIS JSON as profiled in Score by AgGateway
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
                example: binaryCharacters
  /v2/shippedItemInstance:
    get:
      summary: GET JSON from NoSQL Database
      description: Using the shipment identifier and retailer's GLN, the API will return the original JSON that an array of items shipped from a retailer to the farmer.
      operationId: get-shippediteminstance
      tags:
        - Shipped Item Instance
      parameters:
        - name: shipment.identifier
          in: query
          description: shipment identifier generated by the retailer's system of the product shipped to the farmer.
          required: true
          schema:
            type: string
        - name: retailer.identifier
          in: query
          description: the GLN identifier of the retailer that shipped the product to the farmer.
          required: true
          schema:
            type: string
        - name: content-type
          in: header
          description: the content type that should be returned in the response.
          required: true
          schema:
            enum:
              - application/json
            type: string
            default: application/json
      responses:
        '200':
          description: OAGIS JSON as profiled in Score by AgGateway
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/shippedItemInstance'
    post:
      summary: POST JSON to NoSQL Database
      description: ''
      operationId: post-shippediteminstance
      tags:
        - Shipped Item Instance
      requestBody:
        description: OAGIS JSON as profiled in Score by AgGateway
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/shippedItemInstance'
      responses:
        '200':
          description: 'returns the NoSQL DB id generated on insert'
          content:
            application/json:
              schema:
                type: string
                example: 9e944f86-1038-4ffa-b1ec-aefb6bb0c8b0
    put:
      summary: PUT an updated JSON to NoSQL Database
      description: ''
      operationId: put-shippediteminstance
      tags:
        - Shipped Item Instance
      parameters:
        - name: id
          in: query
          description: This is the id that was returned by the post-shippediteminstance operation.
          required: true
          schema:
            type: string
            example: 9e944f86-1038-4ffa-b1ec-aefb6bb0c8b0
      requestBody:
        description: OAGIS JSON as profiled in Score by AgGateway
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/shippedItemInstance'
      responses:
        '200':
          description: 'Returns the id updated'
          content:
            application/json:
              schema:
                type: string
                example: 9e944f86-1038-4ffa-b1ec-aefb6bb0c8b0
    delete:
      summary: DELETE JSON from NoSQL Database
      description: ''
      operationId: delete-shippediteminstance
      tags:
        - Shipped Item Instance
      parameters:
        - name: id
          in: query
          description: This is the id that was returned by the post-shippediteminstance operation.
          required: true
          schema:
            type: string
            example: 9e944f86-1038-4ffa-b1ec-aefb6bb0c8b0
      responses:
        '200':
          description: Returns the id deleted
          content:
            application/json:
              schema:
                type: string
                example: 9e944f86-1038-4ffa-b1ec-aefb6bb0c8b0

components:
  schemas:
    shippedItemInstance:
      required:
      - "shippedItemInstance"
      additionalProperties: false
      properties:
        shippedItemInstance:
          type: "array"
          items:
            additionalProperties: false
            properties:
              typeCode:
                description: "type of product shipped; Seed, CP = Crop protection,\
                  \ or CN = Crop Nutrition"
                example: "seed"
                type: "string"
                format: "token"
              uid:
                description: "DataMatrix or barcode encoding string"
                type: "object"
                required:
                - "content"
                additionalProperties: false
                properties:
                  content:
                    type: "string"
                    format: "normalizedString"
                    example: "0-539f82b1-df6e-11e9-b486-5ce0c51e62ce"
                  schemeIdentifier:
                    description: "encoding scheme"
                    example: "DataMatrix"
                    type: "string"
                    format: "token"
                  schemeAgencyIdentifier:
                    description: "Agency defining bar coding scheme"
                    example: "GS1"
                    type: "string"
                    format: "token"
                  typeCode:
                    description: "Implementation Guideline for encoding scheme"
                    example: "AgGateway"
                    type: "string"
                    format: "token"
              lot:
                description: "the various lot and / or batch identifiers associated\
                  \ to the shipped item\nLot identifier is related to homogeneous\
                  \ items, such as seed, grains.\nBatch identifiers are related to\
                  \ the mixture of homogeneous items, based on a formulation of mixed\
                  \ active ingredient of crop nutrition or crop protection."
                type: "object"
                additionalProperties: false
                properties:
                  typeCode:
                    description: "if typeCode=Seed, then Lot, else Batch for CN and\
                      \ CP"
                    example: "Lot"
                    type: "string"
                    format: "token"
                  identifier:
                    description: "lot or batch identifier value"
                    type: "object"
                    required:
                    - "content"
                    additionalProperties: false
                    properties:
                      content:
                        type: "string"
                        format: "normalizedString"
                        example: "769MXJ4JX"
                      typeCode:
                        description: "seed use 'lot', seed treatment use 'batch',\
                          \ crop protection use 'batch', crop nutrition use 'batch'"
                        example: "Lot"
                        type: "string"
                        format: "token"
                  serialNumberIdentifier:
                    description: "If typeCode = CP; array of serial numbers for serialized\
                      \ jugs of crop protection products linked to a special batch.\
                      \  Useful for blockchain applications such as Crop Protection."
                    type: "array"
                    items:
                      example: "c93b67b1-b62e-45b4-96fe-1277a341dc0d"
                      type: "string"
                      format: "normalizedString"
              item:
                type: "object"
                additionalProperties: false
                properties:
                  manufacturerItemIdentification:
                    description: "Manufacturer's Item identifier"
                    type: "object"
                    additionalProperties: false
                    properties:
                      typeCode:
                        description: "type of manufacturer's item identifier"
                        example: "SKU"
                        type: "string"
                        format: "token"
                      identifier:
                        description: "if no GTIN, then this is required, likely the\
                          \ manufacturer's SKU"
                        example: "34323656565"
                        type: "string"
                        format: "normalizedString"
                  upcid:
                    description: "Uniform Product Code"
                    example: "888346580291"
                    type: "string"
                    format: "normalizedString"
                  gtinid:
                    description: "GTIN for the packaged product instance, as maintained\
                      \ by GS1"
                    example: "00888346580291"
                    type: "string"
                    format: "normalizedString"
                  description:
                    description: "Full AGIIS description"
                    example: "VT DoublePro RIB Complete Relative Maturity 85 days"
                    type: "string"
                  substance:
                    description: "Item composition for Crop Nutrition and Crop Protection."
                    type: "array"
                    items:
                      type: "object"
                      additionalProperties: false
                      properties:
                        name:
                          example: "Ammonium Polyphosphate "
                          type: "string"
                        quantity:
                          type: "array"
                          items:
                            type: "object"
                            required:
                            - "content"
                            additionalProperties: false
                            properties:
                              content:
                                type: "number"
                                example: "43"
                              typeCode:
                                description: "If Range from SDS, Minimum or Maximum,\
                                  \ if Actual Process Control Dispensed Reading then\
                                  \ Actual"
                                example: "Minimum"
                                type: "string"
                                format: "token"
                              unitCode:
                                description: "Percentage"
                                example: "PCT"
                                type: "string"
                                format: "token"
                        registrationStatus:
                          type: "array"
                          items:
                            type: "object"
                            additionalProperties: false
                            properties:
                              identifier:
                                type: "object"
                                required:
                                - "content"
                                additionalProperties: false
                                properties:
                                  content:
                                    type: "string"
                                    format: "normalizedString"
                                    example: "68333-79-9"
                                  typeCode:
                                    example: "CAS"
                                    type: "string"
                                    format: "token"
                                  schemeAgencyIdentifier:
                                    example: "Chemical Abstract Service"
                                    type: "string"
                                    format: "token"
                              effectiveTimePeriod:
                                type: "object"
                                additionalProperties: false
                                properties:
                                  endDateTime:
                                    description: "End date for Registration"
                                    example: "2030-07-01"
                                    type: "string"
                                    format: "date"
                  packaging:
                    description: "This is the per stocking unit packaging, such as\
                      \ a bag of seed.\nOther examples such as a carton of 2  x 2.5\
                      \ Gallon Jugs of crop protection will be deferred to the next\
                      \ WGxx, likely to update to the same structure as found in product\
                      \ catalog."
                    type: "object"
                    additionalProperties: false
                    properties:
                      perPackageQuantity:
                        type: "object"
                        required:
                        - "content"
                        additionalProperties: false
                        properties:
                          content:
                            type: "number"
                            example: "55"
                          unitCode:
                            example: "LB"
                            type: "string"
                            format: "token"
                  productName:
                    description: "product name"
                    example: "CP2585"
                    type: "string"
                  brandName:
                    description: "brand name"
                    example: "CROPLAN"
                    type: "string"
                  varietyName:
                    description: "Variety of a product or brand, perhaps a minor genetic\
                      \ trait or grading typically based on quality measures (sorting)"
                    example: "VT2P/RIB"
                    type: "string"
                  itemTreatment:
                    description: "Seed Treatment; List of product mixture identifiers\
                      \ that were blended together to create the seed treatment, and\
                      \ when lot[typeCode='batch'].identifier is present\nThis should\
                      \ be Item Composition component"
                    type: "object"
                    additionalProperties: false
                    properties:
                      identifier:
                        description: "Manufacturer's or Retailer's Seed Treatment\
                          \ identifier"
                        example: "1001339"
                        type: "string"
                        format: "normalizedString"
                      name:
                        description: "Manufacturer or Retailer's name of the seed\
                          \ treatment"
                        example: "Fortivent® Plus"
                        type: "string"
                      substance:
                        description: "Substances found in the seed treatment"
                        type: "array"
                        items:
                          type: "object"
                          additionalProperties: false
                          properties:
                            typeCode:
                              example: "active_ingredient"
                              type: "string"
                              format: "token"
                            identifier:
                              description: "AgGateway will use the same controlled\
                                \ vocabulary as active ingredient in Product Catalog"
                              example: "Ethaboxam"
                              type: "string"
                              format: "normalizedString"
                            name:
                              description: "The name of the substance found in the\
                                \ seed treatment"
                              example: "Ethaboxam Fungicide"
                              type: "string"
                            quantity:
                              type: "array"
                              items:
                                type: "object"
                                required:
                                - "content"
                                additionalProperties: false
                                properties:
                                  content:
                                    type: "number"
                                    example: "22"
                                  typeCode:
                                    description: "If Range from SDS, Minimum or Maximum,\
                                      \ if Actual Process Control Dispensed Reading\
                                      \ then Actual"
                                    example: "Minimum "
                                    type: "string"
                                    format: "token"
                                  unitCode:
                                    description: "Percentage"
                                    example: "PCT"
                                    type: "string"
                                    format: "token"
                            registrationStatus:
                              type: "array"
                              items:
                                type: "object"
                                additionalProperties: false
                                properties:
                                  identifier:
                                    description: "Registration Identifier provided\
                                      \ by the agency maintaining the registry; e.g,\
                                      \ CAS, EPA, PRMA (Canada)"
                                    type: "object"
                                    required:
                                    - "content"
                                    additionalProperties: false
                                    properties:
                                      content:
                                        type: "string"
                                        format: "normalizedString"
                                        example: "162650-77-3"
                                      schemeAgencyIdentifier:
                                        example: "Chemical Abstracts Service"
                                        type: "string"
                                        format: "token"
                                      typeCode:
                                        example: "CAS"
                                        type: "string"
                                        format: "token"
                                  effectiveTimePeriod:
                                    type: "object"
                                    additionalProperties: false
                                    properties:
                                      endDateTime:
                                        example: "2030-07-01"
                                        type: "string"
                                        format: "date"
              quantity:
                description: "Number of seed bags or quantity of other product if\
                  \ crop protection"
                type: "object"
                required:
                - "content"
                additionalProperties: false
                properties:
                  content:
                    type: "number"
                    example: "45"
                  unitCode:
                    example: "BG"
                    type: "string"
                    format: "token"
              description:
                description: "This is the 'mics_display' description which is a concatenation\
                  \ seed lot identifier, prefixed by the product description"
                type: "object"
                required:
                - "content"
                additionalProperties: false
                properties:
                  content:
                    type: "string"
                    example: "CP2585-769MXJ4JX"
                  typeCode:
                    description: "\"mics_display\" first ten characters of long description\
                      \ and ten characters of lot identifier; .e.g, DKC6253RIB-769MXJ4JX\n\
                      \"long\" description  DKC62-53RIB AF2 VR2P SP50 BAS250 B"
                    example: "mics_display"
                    type: "string"
                    format: "token"
              classification:
                type: "object"
                additionalProperties: false
                properties:
                  typeCode:
                    description: "Type of classification"
                    example: "Crop"
                    type: "string"
                    format: "token"
                  codes:
                    type: "object"
                    required:
                    - "code"
                    additionalProperties: false
                    properties:
                      code:
                        type: "array"
                        minItems: 1
                        items:
                          type: "object"
                          required:
                          - "content"
                          additionalProperties: false
                          properties:
                            content:
                              type: "string"
                              format: "normalizedString"
                              example: "11199199"
                            listAgencyIdentifier:
                              example: "USDA"
                              type: "string"
                              format: "token"
                            typeCode:
                              description: "Use as the description / definition."
                              example: "Corn For Grain"
                              type: "string"
                              format: "token"
              packaging:
                description: "Used for a shipping pallet if individual bags of seed,\
                  \ or a seed box where multiple bags of seed are treated at a retailer\
                  \ and conveyed into a tote or seed box (mini-bulk) for use with\
                  \ a seed tender.  \nA printed manifest tag with barcode detailed\
                  \ in packaging.identifier must be included with the seed box, tote\
                  \ or pallet for ease of use.\nIt is NOT recommended to commingle\
                  \ seed varieties and seed lots.   But if that does happen, multiple\
                  \ shipped item instances array entries would have the same destination\
                  \ package, denoting the which seed varieties and seed lot may have\
                  \ been mixed into a single tote or seed box. \nThe dimensions of\
                  \ a seed box e.g. https://www.rppcontainers.com/Hopper-Bottom-Containers/hopper-bottom-57x45x65,\
                  \ or pallet are not in scope."
                type: "object"
                additionalProperties: false
                properties:
                  typeCode:
                    description: "Type of packaging; Seed Box, Tote, Pallet; \n"
                    example: "SeedBox"
                    type: "string"
                    format: "token"
                  identifier:
                    description: "Identifier of the container, often a serial number\
                      \ of a reusable containers such as a seed tender, bulk box,\
                      \ pallet, etc.\n"
                    example: "844f95ac-422a-406a-91c5-65d017de2f09"
                    type: "string"
                    format: "normalizedString"
                  quantity:
                    description: "Total gross weight of the seed box, or pallet. \
                      \ \nThis is defined as the tare weight (weight of the container,\
                      \ box or pallet) plus the net weight, which is the number of\
                      \ bags x weight of each bag, plus the weight of the treatment\
                      \ if seed treatment and loaded into the seed box."
                    type: "object"
                    required:
                    - "content"
                    additionalProperties: false
                    properties:
                      content:
                        type: "number"
                        example: "2475"
                      typeCode:
                        description: "Gross Weight of the shipping container"
                        example: "GrossWeight"
                        type: "string"
                        format: "token"
                      unitCode:
                        description: "Unit of measure of the gross weight"
                        example: "LB"
                        type: "string"
                        format: "token"
              attachment:
                type: "object"
                additionalProperties: false
                properties:
                  typeCode:
                    description: "Reference Data API"
                    example: "AGIIS"
                    type: "string"
                    format: "token"
                  uri:
                    description: "URI link to Product as defined in AGIIS"
                    example: "https://api.agiis.org/"
                    type: "string"
                    format: "normalizedString"
              manufacturingParty:
                description: "Manufacturer of the product going into the field"
                type: "object"
                additionalProperties: false
                properties:
                  identifier:
                    description: "GLN for the manufacturer"
                    type: "object"
                    required:
                    - "content"
                    additionalProperties: false
                    properties:
                      content:
                        type: "string"
                        format: "normalizedString"
                        example: "34343401245"
                      typeCode:
                        description: "type of identifier for the manufacturer"
                        example: "GLN"
                        type: "string"
                        format: "token"
                  name:
                    description: "product manufacturer's name"
                    example: "WinField United"
                    type: "string"
              party:
                description: "parties involved with the shipment transaction, usually\
                  \ distributor, retailer and grower"
                type: "array"
                items:
                  type: "object"
                  additionalProperties: false
                  properties:
                    typeCode:
                      description: "retailer | farmer | distributor | agronomist |\
                        \ grower | nutritionist"
                      example: "retailer"
                      type: "string"
                      format: "token"
                    identifier:
                      description: "if typeCode='retailer', identifier of shipper/\
                        \ retailer\nif typeCode='farmer', identifier of the farmer, "
                      type: "array"
                      items:
                        type: "object"
                        required:
                        - "content"
                        additionalProperties: false
                        properties:
                          content:
                            type: "string"
                            format: "normalizedString"
                            example: "1100028417954"
                          typeCode:
                            description: "Global Local Number for Retailer's location"
                            example: "GLN"
                            type: "string"
                            format: "token"
                    name:
                      description: "Name  of shipper/ retailer / farmer"
                      example: "Ceres Solutions"
                      type: "string"
                    location:
                      type: "object"
                      additionalProperties: false
                      properties:
                        name:
                          description: "location name, if multiple locations for a\
                            \ party"
                          example: "New Lebanon Seed Hub"
                          type: "string"
                        glnid:
                          example: "1100028417954"
                          type: "string"
                          format: "normalizedString"
              results:
                type: "object"
                additionalProperties: false
                properties:
                  quantitative:
                    type: "array"
                    items:
                      type: "object"
                      additionalProperties: false
                      properties:
                        typeCode:
                          example: "SeedCountPerPound"
                          type: "string"
                          format: "token"
                        name:
                          description: "Name of the measurement"
                          example: "Seed Count Per Pound"
                          type: "string"
                        uomCode:
                          description: "Unit of the measure"
                          type: "object"
                          required:
                          - "content"
                          additionalProperties: false
                          properties:
                            content:
                              type: "string"
                              format: "token"
                              example: "Seeds/LB"
                            listIdentifier:
                              description: "List "
                              example: "https://www.idseed.org/pages/seed_size_measurement_protocol_new.html"
                              type: "string"
                              format: "normalizedString"
                            listAgencyIdentifier:
                              description: "agency managing the list"
                              example: "IPSA"
                              type: "string"
                              format: "token"
                        significantDigitsNumber:
                          example: "0"
                          type: "number"
                        measurement:
                          type: "array"
                          items:
                            type: "object"
                            required:
                            - "measure"
                            additionalProperties: false
                            properties:
                              dateTime:
                                description: "Timestamp of the measurement"
                                example: "2021-02-08T13:17:45.034-05:00"
                                type: "string"
                                format: "date-time"
                              measure:
                                example: "892"
                                type: "number"
              shipmentReference:
                description: "Shipment reference information"
                type: "object"
                additionalProperties: false
                properties:
                  identifier:
                    description: "shipment identifier"
                    example: "34343535"
                    type: "string"
                    format: "normalizedString"
                  documentDateTime:
                    description: "Shipment Date time"
                    example: "2022-04-07T15:15:01.123-05:00"
                    type: "string"
                    format: "date-time"
                  lineNumberIdentifier:
                    description: "Line Identifier on the delivery document the shipped\
                      \ item appears.   This could be a concatenation of the shipment\
                      \ identifier and a line identifier to guarantee uniqueness within\
                      \ this document."
                    example: "34343535-1"
                    type: "string"
                    format: "normalizedString"
                  carrierParty:
                    type: "object"
                    additionalProperties: false
                    properties:
                      identifier:
                        example: "Fleet"
                        type: "string"
                        format: "normalizedString"
                      scacid:
                        example: "NA"
                        type: "string"
                        format: "normalizedString"
                      name:
                        description: "Name of carrier"
                        example: "Ceres Fleet"
                        type: "string"
